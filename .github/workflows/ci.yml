name: Node CI

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  schedule:
    # run every day at midnight UTC
    - cron: '0 0 * * *'
  pull_request:
  workflow_dispatch:
  push:
    branches: main

env:
  CI: true
  COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_TOKEN }}
  COVERALLS_GIT_BRANCH: main


jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # - name: Setup kernel for react native, increase watchers
      #   run: echo fs.inotify.max_user_watches=524288 | sudo tee -a /etc/sysctl.conf && sudo sysctl -p

      # used to centralize the node version across workflows
      # refs https://arinco.com.au/blog/github-actions-share-environment-variables-across-workflows
      # refs https://github.com/marketplace/actions/set-environment-variables
      - name: Set Environment Variables
        uses: tw3lveparsecs/github-actions-setvars@v0.2
        with:
          envFilePath: ./envvars.for.actions

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Attempt to restore the cache
        uses: actions/cache@v6
        id: cache
        with:
          path: |
            ./node_modules
            ~/.cache/Cypress
          key: ${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: install
        if: steps.cache.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

  test:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v7
      - name: Set Environment Variables
        uses: tw3lveparsecs/github-actions-setvars@v0.2
        with:
          envFilePath: ./envvars.for.actions

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Attempt to restore the cache
        uses: actions/cache@v6
        id: cache_restore
        with:
          fail-on-cache-miss: true
          path: |
            ./node_modules
            ~/.cache/Cypress
          key: ${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: coverage
        if: github.ref == 'refs/heads/main'
        run: pnpm coverage

      - uses: actions/upload-artifact@v7
        if: github.ref == 'refs/heads/main'
        with:
          name: jest-lcov
          path: coverage/lcov.info

      - name: coverage (no coveralls)
        if: github.ref != 'refs/heads/main'
        run: pnpm coverage

  acceptance:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set Environment Variables
        uses: tw3lveparsecs/github-actions-setvars@v0.2
        with:
          envFilePath: ./envvars.for.actions

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Attempt to restore the cache
        uses: actions/cache@v6
        id: cache_restore
        with:
          fail-on-cache-miss: true
          path: |
            ./node_modules
            ~/.cache/Cypress
          key: ${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: export display
        run: |
          /usr/bin/Xvfb :99 -screen 0 1024x768x24 > /dev/null 2>&1 &
          echo ">>> Started xvfb"
      - name: delete coverage folder
        run: rm -rf coverage/

      - name: Apply dependency patches
        run: pnpm exec patch-package

      - name: lint
        run: pnpm lint

      - name: build application
        run: pnpm build

      - name: Run cypress (acceptance tests)
        uses: cypress-io/github-action@v6
        env:
          CYPRESS_INSTRUMENT_PRODUCTION: false
          DISABLE_ESLINT_PLUGIN: true
          CYPRESS_BASE_URL: 'http://localhost:3000'
          CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
        with:
          record: true
          parallel: true
          group: 'json-tool'
          wait-on: 'http://localhost:3000'
          start: pnpm start-instrumented
          browser: chrome
          headed: true
          install-command: pnpm install --frozen-lockfile

      - name: Generate lcov
        run: pnpm exec nyc report --reporter=lcov

      # - name: Chromatic
      #   if: github.ref == 'refs/heads/main'
      #   run: pnpm exec chromatic --cypress --project-token="${{ secrets.CHROMATIC_KEY }}" --exit-zero-on-changes

      - uses: actions/upload-artifact@v7
        if: github.ref == 'refs/heads/main'
        with:
          name: cypress-lcov
          path: coverage/lcov.info

  coverage:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [build, test, acceptance]
    steps:
      - uses: actions/checkout@v7
      - name: Set Environment Variables
        uses: tw3lveparsecs/github-actions-setvars@v0.2
        with:
          envFilePath: ./envvars.for.actions

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Attempt to restore the cache
        uses: actions/cache@v6
        with:
          fail-on-cache-miss: true
          path: |
            ./node_modules
            ~/.cache/Cypress
          key: ${{ hashFiles('**/pnpm-lock.yaml') }}
      
      - uses: actions/download-artifact@v8
        with:
          path: coverage/
          pattern: "*-lcov"
          merge-multiple: false
      - run: |
          mkdir merged_coverage
          mv coverage/cypress-lcov/lcov.info merged_coverage/cypress.info
          mv coverage/jest-lcov/lcov.info merged_coverage/jest.info
          pnpm exec lcov-result-merger './merged_coverage/*' merged_coverage.info
          pnpm coveralls
      - uses: actions/upload-artifact@v7
        with:
          name: merged-lcov
          path: merged_coverage.info

      - name: Sonarqube upload
        continue-on-error: true
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  delivery:
    runs-on: ubuntu-latest
    needs: [test, acceptance]
    if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, 'tagged version')

    steps:
      - uses: actions/checkout@v7
      - name: Set Environment Variables
        uses: tw3lveparsecs/github-actions-setvars@v0.2
        with:
          envFilePath: ./envvars.for.actions

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Attempt to restore the cache
        uses: actions/cache@v6
        id: cache_restore
        with:
          fail-on-cache-miss: true
          path: |
            ./node_modules
            ~/.cache/Cypress
          key: ${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: package
        run: pnpm package
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: fetch snap file
        id: snap_file
        run: echo "::set-output name=name::$(ls dist/*.snap | sed "s/dist\///g" | sed "s/\.snap//g")"

      - name: publish snap edge channel
        uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.STORE_LOGIN }}
        with:
          store_login: ${{ secrets.STORE_LOGIN }}
          snap: "dist/${{ steps.snap_file.outputs.name }}.snap"
          release: edge,beta,candidate,stable

  dependabot:
    runs-on: ubuntu-latest
    needs: [test, acceptance]
    if: ${{ github.actor == 'dependabot[bot]' }}
    permissions:
      pull-requests: write
      contents: write
      repository-projects: read

    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3.1.0
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"
          skip-commit-verification: true

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Approve a PR if not already approved
        run: |
          gh pr checkout "$PR_URL"
            if [ "$(gh pr status --json reviewDecision -q .currentBranch.reviewDecision)" != "APPROVED" ];
          then
            gh pr review --approve "$PR_URL"
          else
            echo "PR already approved.";
          fi
        env:
          PR_URL: ${{github.event.pull_request.html_url}}
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}

      - name: Enable auto-merge for Dependabot PRs
        if: ${{ contains(github.event.pull_request.title, 'bump')}}
        run: gh pr merge --auto --rebase "$PR_URL"
        env:
          PR_URL: ${{github.event.pull_request.html_url}}
          GH_TOKEN: ${{secrets.GITHUB_TOKEN}}